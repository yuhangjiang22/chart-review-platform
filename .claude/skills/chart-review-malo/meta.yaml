overview_prose: >-
  Pre-screening against the eligibility criteria of Lilly trial N1T-MC-MALO
  (NCT07165028), a MASLD/MASH trial. Each criteria file is one TRAIT from the
  decomposition component's output, not one protocol criterion - the Circe
  ALL/ANY/AT_LEAST/AT_MOST logic between traits is applied at aggregation, not by
  the agent. The agent answers one small factual question per trait and cites the
  evidence it used. It never decides eligibility.
  Scope: the 122 traits NOT marked Structured_only; the other
  91 are answered from structured data by a different lane.
