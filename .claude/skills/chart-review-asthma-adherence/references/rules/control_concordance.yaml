# T1 — Control assessment concordance. Each rule expresses an EPR-3 or
# 2020 Focused Update requirement and what should happen when the chart
# fails to demonstrate it.

rules:
  - rule_id: R-T1-ControllerForPersistent
    description: >-
      Persistent asthma (T1-ControlLevel in not_well_controlled /
      very_poorly_controlled, OR >= 2 exacerbations) must have an active
      controller prescribed. T1-ControlLevel is the age-appropriate composite
      (ACT/C-ACT when charted, else documented impairment + risk).
    naepp_source: >-
      EPR-3 Component 4 p.213 (Key Points: Medications) — 'long-term
      control medications [are] used to achieve and maintain control of
      persistent asthma' and ICS is 'the most potent and effective
      anti-inflammatory medication' (Evidence A). Stepwise approach
      Figure 4-5 prescribes a controller at Step 2 and above.
    evidence_grade: A
    event_anchor: obligation_points
    # GRACE WINDOW — settled (study lead, 2026-08-27): the controller must be
    # active BY THE EVENT'S DEADLINE (anchor.meta.deadline, the patient's next
    # asthma visit after the obligation date, computed by the ETL). Three
    # framings had been in play and they disagree on the patient who does the
    # right thing: the question text said "active AT OR AFTER the event date"
    # (no upper bound, so a controller started eight months late passed), the
    # batch prompt said "answer AS OF THAT EVENT'S DATE" (no grace period, so
    # starting one at the next visit FAILED), and the ETL computed a deadline
    # that nothing read. "By the deadline" is what EPR-3 means and what the
    # deadline was computed for; the other two are now worded to match.
    verdict_if: "T1-ControllerPrescribed == true"
    # A CENSORED DEADLINE IS NOT A CARE GAP. When no asthma visit is observed
    # after the obligation, the ETL censors the deadline at index_date and flags
    # it: the grace period ran past the end of observation, so the chart cannot
    # show whether the controller was started in time. Judging it anyway scores a
    # gap the data does not support — 8% of obligation points in the local corpus
    # are censored. The engine exposes the flag as the synthetic
    # `_deadline_censored`, since no extraction could supply it.
    event_censored_if: '_deadline_censored == true'
    event_censored_reason: >-
      grace period ran past the end of observation (no asthma visit after the
      obligation date, so the deadline is censored at the index date)
    # v0.6: collapsed to the design document's five categories.
    # PATIENT_REFUSAL and CONTRAINDICATION were refinements of PATIENT_FACTOR,
    # which the design defines as "documented clinical reason for deviation
    # (allergy, contraindication, patient preference)" — all three arms of this
    # question land there. They were the question's ENUM VALUES promoted to
    # top-level categories, which is how a five-category taxonomy became nine.
    #
    # These lines were INSIDE the block scalar above until 2026-08-28. `#` is not
    # a comment inside `>-`, so the reviewer-facing censoring reason was a
    # 565-character string ending in taxonomy commentary about a different field —
    # and evaluateRuleEvents uses that whole string as its idempotency sentinel.
    attribution_when:
      - when: "T1-ControllerPrescribed != true and T2-ContraindicationDocumented in [\"patient_refusal\", \"contraindication\", \"pending_followup\"]"
        category: PATIENT_FACTOR
      - when: "T1-ControllerPrescribed != true and T2-ContraindicationDocumented == \"system_barrier\""
        category: SYSTEM_FACTOR
      - when: "T1-ControllerPrescribed != true"
        category: DOCUMENTATION_GAP
    nuanced: true
    judge_can_override: false
    supporting_questions: [T1-ControlLevel, T1-ExacerbationsCount, T1-ControllerPrescribed, T2-ContraindicationDocumented]

  # THE OTHER ARM OF PERSISTENT ASTHMA (added 2026-08-28, study lead: option A).
  #
  # R-T1-ControllerForPersistent's description defines persistent asthma as
  # "not_well_controlled / very_poorly_controlled OR >= 2 exacerbations", but it
  # anchors on `obligation_points`, which the ETL derives from the exacerbation
  # arm alone. The control arm was implemented NOWHERE — not in the anchor, not
  # in the rule — so a child not well controlled at every visit who never had two
  # OCS courses produced zero events, rolled up EXCLUDED, and dropped silently out
  # of the study's most important measurement. That bias runs UPWARD (a missed
  # care gap), unlike every other defect found in this audit.
  #
  # It could not be fixed in the ETL: control level is a judgment made FROM THE
  # NOTES, after enumeration, and structured ACT is absent from this drop
  # entirely (conformance act_structured = 0). No anchor list can carry it.
  #
  # So this rule uses the shape R-T2-FollowupScheduled and R-T2-StepTherapyMatches
  # already use: enumerate every asthma visit as a CANDIDATE, and let the
  # per-event control level decide whether the requirement applied there.
  #
  # A separate rule rather than re-anchoring the existing one, because
  # re-anchoring would change that rule's denominator from one obligation point
  # per patient to one per visit AND reopen the "by the deadline" semantics
  # settled on 2026-08-27. Two rules, two denominators: report them per rule and
  # never sum them — a patient with two exacerbations AND uncontrolled visits is
  # measured by both, correctly, as two different requirements.
  - rule_id: R-T1-ControllerAtUncontrolledVisit
    description: >-
      At a visit where asthma is NOT well controlled, a controller is prescribed.
      This is the control-level arm of persistent asthma; the exacerbation arm
      (>= 2 in a rolling year) is R-T1-ControllerForPersistent. Applicability is
      decided per visit from that visit's own control level, so a patient
      controlled at every visit contributes no events.
    naepp_source: >-
      EPR-3 Component 4 p.213 (Key Points: Medications) — long-term control
      medication is used 'to achieve and maintain control of persistent asthma',
      ICS being 'the most potent and effective anti-inflammatory medication'
      (Evidence A). Stepwise Figure 4-5 prescribes a controller from Step 2 up,
      and Figures 4-2a / 4-2b direct a STEP UP when control is not maintained —
      i.e. the not-well-controlled visit is itself the indication.
    evidence_grade: A
    event_anchor: asthma_encounters
    # OUTPATIENT VISITS ONLY (decision 7, study lead 2026-09-03). `asthma_encounters`
    # includes ED-only days. Stepping up daily controller therapy is a longitudinal
    # decision belonging to the clinician managing the chronic disease; an ED
    # physician's task is acute stabilisation, and ED discharge routinely and
    # deliberately DEFERS the controller decision to the PCP. Scoring the gap here
    # would file it against the wrong clinician, and audit-and-feedback would go to
    # the wrong service. The signal is not lost: an asthma ED visit is already an
    # exacerbation (feeding obligation_points, where the deadline model gives the
    # family a fair grace period) and already a follow-up trigger — judging it here
    # too counted one visit twice. R-T2-FollowupScheduled keeps ED anchors on
    # purpose; post-ED follow-up IS an EPR-3 requirement and the responsible party
    # there is the system, which is what that rule audits.
    # NOTE: `meta.kind` currently understates ED — it is decided by the date
    # fallback until the extract carries `asthma_dx_linked` (see
    # asthma_encounter_anchors' docstring), so this gate is only partly effective
    # until the ETL is re-run.
    event_evaluable_if: 'T1-ControlLevel in ["not_well_controlled", "very_poorly_controlled"] and _anchor_kind != "ed"'
    # JUDGED AT THE VISIT, not by a later deadline — deliberately different from
    # R-T1-ControllerForPersistent, and for a reason specific to this anchor. That
    # rule's obligation is established by an exacerbation, which can happen while
    # the patient is nowhere near a clinician, so demanding a controller that same
    # day would fail a family that did everything right; hence its grace period to
    # the next asthma visit. Here the patient IS in front of the clinician, and
    # EPR-3's own instruction at a not-well-controlled visit is to step up
    # treatment at that visit. A controller STARTED at this visit counts as
    # prescribed for it.
    verdict_if: "T1-ControllerPrescribed == true"
    # Same three arms as the exacerbation rule, so an identical clinical situation
    # is attributed identically whichever rule caught it.
    attribution_when:
      - when: "T1-ControllerPrescribed != true and T2-ContraindicationDocumented in [\"patient_refusal\", \"contraindication\", \"pending_followup\"]"
        category: PATIENT_FACTOR
      - when: "T1-ControllerPrescribed != true and T2-ContraindicationDocumented == \"system_barrier\""
        category: SYSTEM_FACTOR
      - when: "T1-ControllerPrescribed != true"
        category: DOCUMENTATION_GAP
    nuanced: true
    judge_can_override: false
    supporting_questions: [T1-ControlLevel, T1-ControllerPrescribed, T2-ContraindicationDocumented]

  - rule_id: R-T1-NoSABAOveruse
    description: >-
      No SABA over-dispensing (>= 3 canisters dispensed/year, a proxy for
      overuse). High SABA dispensing signals poorly-controlled disease that
      wasn't escalated.
    naepp_source: >-
      EPR-3 Component 1 Figure 3-5 (Classifying Asthma Severity) — SABA
      use >2 days/week (not for EIB) classifies as 'not well controlled'.
      Operationalized as ≥3 canisters/year per HEDIS AMR. SABA overuse
      is among the strongest predictors of asthma-related morbidity and
      mortality (EPR-3 p.39 risk-domain discussion).
    evidence_grade: A
    verdict_if: "T1-SABAOveruse == \"false\" or T1-SABAOveruse == false"
    excluded_if: "T1-SABAOveruse == \"not_applicable\" or T1-SABAOveruse is missing"
    attribution: GUIDELINE_DEVIATION
    supporting_questions: [T1-SABAOveruse]

  - rule_id: R-T1-SpirometryWithin24mo
    description: >-
      Spirometry documented within the past 24 months (EPR-3 recommends at
      least every 1-2 years for persistent asthma — this rule uses the 2-year
      outer bound, so it never flags a patient the guideline considers
      compliant).
    naepp_source: >-
      EPR-3 Component 1 p.43-45 — 'spirometry is recommended at the
      time of initial assessment, after treatment is initiated and
      symptoms have stabilized, during a period of progressive or
      prolonged loss of control, and at least every 1-2 years'.
    evidence_grade: B
    # THE 24 MONTHS ARE ENFORCED AT THE WRITE PATH, NOT HERE (study lead,
    # 2026-09-03). `is present` is all this expression can say: the expression
    # language has no date arithmetic, and `T1-SpirometryDate`'s answer_schema is a
    # bare `type: string`, so for one version any string whatsoever scored
    # CONCORDANT. Measured over the stored corpus: 3 of 25 non-null answers (12%)
    # were spurious — two dates outside the window, the furthest 2224 days (6.1
    # years) before index, and one answer that was not a date at all. Direction:
    # OVERSTATES care quality.
    #
    # `writeGuards` (packages/mcp-core-adherence) now rejects a non-date and a
    # date outside 730 days, naming null as the correct answer when nothing is
    # documented inside the window. Its 730 and the censoring gate's 730 below
    # must stay equal — a patient censored for a window the write path accepted
    # would be counted two different ways.
    verdict_if: "T1-SpirometryDate is present"
    # A CHART TOO SHORT TO HOLD THE ANSWER IS NOT A CARE GAP (study lead,
    # 2026-08-28). The cohort admits a patient at 365 days of prior observation
    # while this question looks back 730, so for a patient in between, "no
    # spirometry found" may mean it was done before the extract begins. Judging it
    # anyway reports an artifact of the extract window as a documentation gap.
    #
    # cohort.sql emits `days_observed_before_index` for exactly this — its own note
    # says to "exclude the short-lookback patients from the spirometry rule at
    # analysis time rather than from the cohort" — but the ETL dropped the field
    # before meta.json, so the mitigation had nothing to work with until 2026-08-28.
    #
    # ASYMMETRIC, like R-T2-FollowupScheduled's unobserved tail: a spirometry that
    # IS documented settles the event no matter how short the chart is, and no
    # further observation could unsettle it. Only the NEGATIVE is inconclusive. A
    # patient whose extract predates the field carries no value, and a comparison
    # against a missing answer is false — so absent information cannot manufacture
    # an exclusion.
    event_censored_if: '_days_observed_before_index < 730 and T1-SpirometryDate is missing'
    event_censored_reason: >-
      the 24-month lookback runs past the start of observation (this chart covers
      fewer than 730 days before the index date), so it cannot show whether
      spirometry was done in the part that is not covered
    attribution: DOCUMENTATION_GAP
    supporting_questions: [T1-SpirometryDate]

  - rule_id: R-T1-ComorbidityAssessedWhenUncontrolled
    description: >-
      When asthma is not well-controlled, the chart documents
      assessment of at least one comorbidity that affects asthma
      (rhinitis/sinusitis, GERD, obesity, OSA, depression/stress,
      tobacco/environmental exposure). Applicability is decided by the
      engine from T1-WorstControlLevel (the worst level at any visit in
      the period): a patient well controlled at EVERY visit is excluded,
      because EPR-3 indicates the workup for asthma that cannot be well
      controlled. Taking the most recent visit instead would excuse a
      patient who spent mid-year uncontrolled — and those are the
      patients most likely to have no workup.
    naepp_source: >-
      EPR-3 Component 3 p.166 (Key Points) — 'Clinicians should
      evaluate a patient for the presence of a chronic comorbid
      condition when the patient's asthma cannot be well controlled.
      Treating the conditions may improve asthma management.'
      Evidence levels per comorbidity: ABPA (A), GERD (B), obesity (B),
      OSA (D), rhinitis/sinusitis (B), depression (D).
    evidence_grade: B
    verdict_if: "T1-ComorbidityAssessed in [\"assessed_and_addressed\", \"assessed_not_addressed\"]"
    # v0.6: the gate moved OFF the answer and INTO the rule. It used to read
    # T1-ComorbidityAssessed == "not_applicable", i.e. the annotator decided
    # applicability by comparing against T1-ControlLevel — which after the event
    # split has one answer PER VISIT, so there was nothing single to compare
    # against and two annotators could disagree on whether the patient counted
    # at all. A missing derived value (no visit established a control level)
    # leaves the patient IN, matching v0.5's "when undetermined, do NOT answer
    # not_applicable".
    excluded_if: "T1-WorstControlLevel == \"well_controlled\""
    attribution: DOCUMENTATION_GAP
    nuanced: true
    judge_can_override: false
    supporting_questions: [T1-WorstControlLevel, T1-ComorbidityAssessed]
