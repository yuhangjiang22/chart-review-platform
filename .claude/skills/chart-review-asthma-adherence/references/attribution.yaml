# Attribution taxonomy for adherence rule verdicts.
#
# THE ACCR DESIGN'S FIVE (2026-03-Agentic-Asthma-Adherence-Design), and not more.
#
# This file used to list nine: the five plus PATIENT_REFUSAL, CONTRAINDICATION,
# PENDING_FOLLOWUP and OTHER. Its own header called the first two "domain-specific
# refinements of PATIENT_FACTOR" — which is what the design already covers, since
# it defines PATIENT_FACTOR as "documented clinical reason for deviation (allergy,
# contraindication, patient preference)". All three arms live there.
#
# They were not a taxonomy decision. They were the enum values of ONE question
# (T2-ContraindicationDocumented) promoted to top-level categories, which is how a
# five-category taxonomy silently becomes nine.
#
# PENDING_FOLLOWUP additionally merged two things the design keeps apart: a
# clinician's decision to defer (PATIENT_FACTOR) and an insurance/formulary
# barrier (SYSTEM_FACTOR). That merge is why SYSTEM_FACTOR was unreachable —
# declared here and producible by no rule. The question now has a `system_barrier`
# answer for the second case.
#
# OTHER is gone. It was the engine's fallback for a NON_CONCORDANT verdict it
# could not attribute, and both real occurrences came from an input that was never
# answered — a defect, filed as a category. Unanswered inputs now have their own
# state, and a rule that reaches NON_CONCORDANT without declaring an attribution
# is reported as an incomplete rule instead of being quietly bucketed.
#
# Measured before the change: 290 attributions across every run, only
# DOCUMENTATION_GAP (269) and GUIDELINE_DEVIATION (19) ever produced, plus 2 OTHER.
#
# THIS FILE OVERRIDES the platform default in skill-loader.ts — a task adds a
# genuinely domain-specific category HERE, deliberately, rather than by widening
# the platform's list. It is also what the reviewer's UI offers, so anything added
# here is a choice a human will be asked to make.
#
# Design intent: a reviewer should be able to pick exactly one category per
# non-concordant rule. When two seem to apply, prefer the one that changes the
# recommended intervention (DOCUMENTATION_GAP -> documentation training;
# GUIDELINE_DEVIATION -> audit/feedback; SYSTEM_FACTOR -> policy/access fix;
# PATIENT_FACTOR -> patient-centered care decision).

categories:
  - DOCUMENTATION_GAP
  - GUIDELINE_DEVIATION
  - PATIENT_FACTOR
  - SYSTEM_FACTOR
  - INSUFFICIENT_DATA

descriptions:
  DOCUMENTATION_GAP: >-
    The guideline behavior may have happened but isn't recorded in the chart.
    Most common attribution in retrospective review; prompts a documentation
    intervention rather than a clinical change.
  GUIDELINE_DEVIATION: >-
    The chart documents care that diverges from the guideline with no
    countervailing reason (no contraindication, refusal, system barrier, or
    pending plan). Prompts an audit + feedback intervention.
  PATIENT_FACTOR: >-
    A documented clinical reason for the deviation: an allergy or
    contraindication, an explicit patient refusal, a plan to reassess at the
    next visit, a competing comorbidity, or preference framed as shared
    decision-making. The deviation is patient- or clinically-driven rather than
    an omission. (Formerly split across PATIENT_REFUSAL, CONTRAINDICATION and
    the clinical arm of PENDING_FOLLOWUP.)
  SYSTEM_FACTOR: >-
    An institutional or access barrier prevented the guideline-concordant
    action — formulary restriction, insurance denial or appeal in progress,
    referral delay, pharmacy stock-out, specialty access. The deviation is
    neither the patient's nor the clinician's fault.
  INSUFFICIENT_DATA: >-
    There isn't enough information in the available chart to make a
    determination. Distinct from DOCUMENTATION_GAP — that implies the action
    likely happened but wasn't written down; this means we genuinely can't tell
    either way. Common when the lookback window is too short or the patient is
    new to the system.
