# T0 — Eligibility tier (gates whether the patient enters the adherence
# assessment at all). Questions are grounded in NAEPP EPR-3 (2007)
# Diagnosis criteria and platform methodology requirements.

questions:
  - question_id: T0-AsthmaDx
    text: Does the chart document an active diagnosis of asthma (ICD-10 J45.x or
      equivalent prose) at any point in the lookback window?
    tier: 0
    answer_schema:
      type: boolean
      description: true iff an asthma diagnosis is documented; null if unknowable from
        the chart.
    naepp_source: "EPR-3 Section 3, Component 1, p.40-43 — Diagnosis of Asthma;
      Box 3-1 Key Indicators for Considering a Diagnosis of Asthma"
    evidence_grade: clinical_criterion
    clinical_rationale: >-
      EPR-3 requires (1) episodic symptoms of airflow obstruction or airway
      hyperresponsiveness, (2) at least partial reversibility, and (3)
      exclusion of alternative diagnoses. ICD-10 J45.x in the structured record
      is taken as documentation that a clinician applied these criteria.
    retrieval_hints: "STRUCTURED FIRST → read_structured_data(table=\"conditions\").
      Any row with icd10cm matching J45.* (J45.0-J45.99) and status=\"active\"
      is a match. If conditions is empty, fall back to notes: problem list,
      encounter diagnoses, assessment lines. Accept \"asthma\", \"reactive
      airway disease\" only when paired with an asthma ICD code. Don't infer
      from inhaler use alone."

  - question_id: T0-AgeOk
    text: Is the patient age at the index date between 2 and 17 years inclusive
      (the study's pediatric cohort scope)?
    tier: 0
    answer_schema:
      type: boolean
    naepp_source: "Study cohort definition — 'Agentic Chart Review for Pediatric
      Asthma Guideline Adherence', Inclusion Criteria: pediatric patients ages
      2-17 years (Cohort_Definition_Asthma_Adherence.docx; Design doc Study
      Population). NAEPP guideline HANDLING is age-band-stratified (0-4, 5-11,
      12+) and is selected downstream by T0-AgeBand."
    evidence_grade: population_scope
    clinical_rationale: >-
      The study population is pediatric asthma patients ages 2-17. Eligibility
      admits that full range; the age-appropriate guideline logic (control
      instrument, stepwise-therapy table) is then selected by T0-AgeBand,
      because NAEPP EPR-3 applies different criteria to ages 0-4, 5-11, and 12+.
    retrieval_hints: >-
      STRUCTURED FIRST → read_structured_data(table="demographics"). Use
      `age_at_index` directly: true if 2-17 inclusive. Cite that row
      (source: omop, table: demographics, row_id). Fall back to a note
      demographic header only if the demographics table is empty. Return null
      only when neither source states the age.

  - question_id: T0-AgeBand
    text: Which NAEPP guideline age band does the patient fall into at the index
      date? NAEPP applies different control instruments and stepwise-therapy
      tables by band. Within the 2-17 cohort the bands are 2-4 (NAEPP 0-4
      handling), 5-11, and 12-17 (NAEPP 12+ handling).
    tier: 0
    answer_schema:
      type: string
      enum:
        - age_2_4
        - age_5_11
        - age_12_17
    depends_on:
      - T0-AgeOk
    naepp_source: "EPR-3 stratifies diagnosis, control assessment, and the
      stepwise approach by age: 0-4 years (Figures 4-1a / 4-2a), 5-11 years
      (Figures 4-1b / 4-2b), and 12+ years (Figure 4-5). Design doc:
      'Age-stratified guideline handling: NAEPP guidelines differ by age group
      (0-4, 5-11, 12+).'"
    evidence_grade: population_scope
    clinical_rationale: >-
      The correct control instrument (Childhood ACT for 5-11 vs ACT for 12+;
      symptom-based for 2-4) and the correct stepwise-therapy table both depend
      on this band; downstream T1/T2 questions and rules interpret their
      thresholds relative to it. NOTE for analysis: the study's REPORTING strata
      are 2-5 / 6-11 / 12-17, while guideline HANDLING uses the NAEPP boundaries
      above — they differ at age 5 (NAEPP places a 5-year-old in 5-11 / C-ACT).
      PI to confirm the 5-year-old handling before lock.
    retrieval_hints: >-
      STRUCTURED FIRST → read_structured_data(table="demographics"). Use the
      precomputed `age_band` value directly (age_2_4 / age_5_11 / age_12_17) and
      cite that row (source: omop, table: demographics, row_id). Only if the
      demographics table is empty, compute from age at the index date
      (2-4 -> age_2_4; 5-11 -> age_5_11; 12-17 -> age_12_17). Return null only
      when age is unavailable from every source.

  - question_id: T0-LookbackHasNotes
    text: ELIGIBILITY CHECK (study inclusion criterion, NOT a care measure) —
      are there at least 2 ASTHMA-RELATED encounters (primary care, specialty,
      urgent care, or emergency department; NOT inpatient) in the 12 months
      before the index date, AT LEAST ONE of which is outpatient (non-ED)? A
      patient failing this is EXCLUDED from the audit for insufficient
      longitudinal documentation — it is never scored as a care gap.
    tier: 0
    answer_schema:
      type: boolean
    naepp_source: "Study cohort definition §3 Inclusion Criteria — 'At least 2
      asthma-related encounters within the study period' (v0.5 aligns the
      operationalization to this study-plan wording; v0.4 counted ALL outpatient
      encounters). ED included per clinical reviewers (Fedele: many children get
      most asthma care through the ED; Blake: the urgent-care / stand-alone-ED
      line is blurring), with Fedele's floor — the study audits OUTPATIENT
      guideline adherence, so at least one encounter must be outpatient.
      Methodological gate, not a NAEPP recommendation; EPR-3 —
      'Regular review of progress by a concerned clinician is the basis for the
      patient-clinician partnership necessary to achieve asthma control' —
      presupposes longitudinal care."
    evidence_grade: methodological
    clinical_rationale: >-
      Adherence cannot be assessed from a single encounter. EPR-3 grounds the
      assessment of asthma control in 'regular review by an informed clinician'.
      COUNTED FROM THE STRUCTURED encounters table (not a note-title judgment) so
      the eligibility gate is reproducible run-to-run — note-title counting was
      an unreliable, nondeterministic signal.
    retrieval_hints: >-
      STRUCTURED, deterministic. PREFER the v0.5 foundations:
      read_structured_data(table="demographics") → true iff
      `lookback_asthma_encounter_count_12mo` >= 2 (total: any type except
      inpatient, ED included) AND `lookback_asthma_outpatient_count_12mo` >= 1
      (the non-ED floor); cite that row. If those fields are absent (pre-v0.5
      extract), count from read_structured_data(table="encounters"): rows in
      the 12-month lookback that are ASTHMA-RELATED (`asthma_related` = true)
      and NOT inpatient — primary care, specialty clinic, urgent care, AND
      emergency department (`is_ed` = true) all count toward the total of 2,
      but AT LEAST ONE counted encounter must be outpatient (`is_ed` = false).
      EXCLUDE inpatient/hospitalization and administrative/telephone contacts.
      Do NOT use demographics.lookback_outpatient_count_12mo (v0.4: all
      outpatient, not asthma-related). Do NOT judge from note titles. Cite the
      qualifying encounter rows as evidence (source: omop, table: encounters,
      row_id). Fall back to list_notes only if the encounters table is empty.
