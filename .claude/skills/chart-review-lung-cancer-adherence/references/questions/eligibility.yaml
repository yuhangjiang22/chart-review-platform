# T0 — Eligibility + context. Answer options align with the lung-cancer-experiment
# annotation tool's canonical QUESTION_LAYOUTS. Answer these FIRST — histology +
# stage gate the molecular-testing concordance rules.

questions:
  - question_id: MT0a
    text: "Does the patient have a confirmed lung cancer diagnosis (pathologically confirmed, with a date of diagnosis)?"
    tier: 0
    answer_schema:
      type: string
      enum: [yes, no, unclear]
    guideline_reference: "Eligibility — lung cancer diagnosis confirmation."
    retrieval_hints: "Pathology report confirming lung cancer + date of diagnosis."

  - question_id: MT0b
    text: "What is the histologic subtype of the lung cancer?"
    tier: 0
    answer_schema:
      type: string
      enum: [adenocarcinoma, squamous, small_cell, nsclc_nos, large_cell, other, unclear]
    guideline_reference: "Histology — drives the molecular-testing indication (small_cell is generally not required)."
    retrieval_hints: "Pathology 'Diagnosis'/'Histologic type'. small_cell = SCLC; squamous, adenocarcinoma, nsclc_nos are NSCLC."

  - question_id: MT0c
    text: "What is the stage of the lung cancer at diagnosis?"
    tier: 0
    answer_schema:
      type: string
      enum: ["I", "II", "III", "IIIA", "IIIB", "IV", "limited", "extensive", "unknown"]
    guideline_reference: "Stage — advanced/metastatic NSCLC (IIIB/IV) has the strongest molecular-testing indication."
    retrieval_hints: "AJCC stage in pathology/oncology staging notes. limited/extensive apply to small_cell. Use the EARLIEST stage documented for this diagnosis — the stage assigned at initial diagnosis / staging work-up. Do NOT use a later stage from a progression or follow-up note, even when that note states it more plainly. Record the stage at the granularity the chart gives: if it says IIIA or IIIB answer that; if it only says III, answer III."

  - question_id: MT0d
    text: "What is the patient's tobacco use history?"
    tier: 0
    answer_schema:
      type: string
      enum: ["current smoker", "former smoker", "never smoker", "unknown"]
    guideline_reference: "Smoking history — never smokers have higher actionable-mutation prevalence."
    retrieval_hints: "Social history / HPI smoking status. Charts routinely carry CONTRADICTORY smoking-status fields across notes — sometimes on the same day. Do not answer from the first note you find: check whether other notes disagree. Tie-break, strongest evidence first: (1) a documented cessation EVENT (\"quit in 2009\", a quit date) establishes former smoker and OUTRANKS any status field, which is often stale or unmaintained; (2) otherwise an explicit structured status (\"Tobacco use: ...\"), preferring the note closest to the diagnosis date; (3) narrative prose last. When sources genuinely conflict, say so in the rationale and name the note you followed."
